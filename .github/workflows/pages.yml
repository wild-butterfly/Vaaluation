name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - website/**
      - assets/app-icon.svg
      - apps/macos/macos/Vaaluation-macOS/Assets.xcassets/AppIcon.appiconset/icon_128x128@2x.png
      - docs/screenshots/**
      - docs/social-preview.jpg
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          mkdir -p _site/assets
          cp -R website/. _site/
          cp apps/macos/macos/Vaaluation-macOS/Assets.xcassets/AppIcon.appiconset/icon_128x128@2x.png _site/assets/app-icon.png
          cp docs/screenshots/price-check.png _site/assets/price-check.png
          cp docs/screenshots/trades.png _site/assets/trades.png
          cp docs/social-preview.jpg _site/assets/social-preview.jpg
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
