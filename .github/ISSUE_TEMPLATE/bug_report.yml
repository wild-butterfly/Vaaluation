name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug!
  - type: input
    id: version
    attributes:
      label: Vaaluation version
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. macOS 15.5 (Apple Silicon)
    validations:
      required: true
  - type: dropdown
    id: display-mode
    attributes:
      label: Path of Exile display mode
      options:
        - Windowed
        - Windowed Fullscreen
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: item-text
    attributes:
      label: Item text (if parsing-related)
      description: Paste the copied item text. Remove anything you consider private.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Menu bar → View Logs. Logs never contain item text unless debug logging is on.
      render: text
